<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Passport Automation System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            Passport Automation System
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/register">
                Register
            </a>

        </div>

    </nav>


    <div class="center-box">

        <h1>Login</h1>


        <form method="POST" action="/login">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit" class="btn">
                Login
            </button>

        </form>


        <p>
            Don't have an account?

            <a href="/register">
                Register
            </a>
        </p>

    </div>

</body>

</html>
